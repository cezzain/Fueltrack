<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale=1 (not user-scalable=no, which iOS ignores) suppresses
         Safari's auto-zoom on input focus in the standalone app. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
    />
    <title>FuelTrack</title>
    <meta name="description" content="AI-powered calorie & protein tracker" />
    <meta name="theme-color" content="#f4f2ed" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- iOS Add to Home Screen -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="FuelTrack" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
